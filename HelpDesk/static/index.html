<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk</title>
    <style>
        body {
            font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px;
            background: #f5f6f8;
        }
        h1 { font-size: 20px; }
        #chat-log {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .user {
            align-self: flex-end;
            background: #d7e8ff;
            max-width: 80%;
        }
        .agent {
            align-self: flex-start;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            max-width: 80%;
        }
        .error { background: #ffe0e0; border-color: #f5b5b5; }
        .meta {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }
        form { display: flex; gap: 8px; }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #2b6cb0;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled { background: #a0aec0; cursor: wait; }
    </style>
</head>
<body>
    <h1>IT Help Desk 테스트</h1>
    <div id="chat-log"></div>
    <form id="chat-form">
        <input type="text" id="question" placeholder="질문을 입력하세요" autocomplete="off" required>
        <button type="submit" id="send-btn">전송</button>
    </form>

    <script>
        const chatLog = document.getElementById("chat-log");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("question");
        const sendBtn = document.getElementById("send-btn");

        function appendMessage(role, text, meta) {
            const div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            if (meta) {
                const metaDiv = document.createElement("div");
                metaDiv.className = "meta";
                metaDiv.textContent = meta;
                div.appendChild(metaDiv);
            }
            chatLog.appendChild(div);
            div.scrollIntoView({ behavior: "smooth" });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            appendMessage("user", question);
            input.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "대기 중...";

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question }),
                });

                if (!res.ok) {
                    const body = await res.text();
                    throw new Error(`HTTP ${res.status}: ${body}`);
                }

                const data = await res.json();
                const meta = [
                    `session: ${data.session_id}`,
                    data.ticket_id ? `ticket: ${data.ticket_id}` : "ticket: 없음",
                ].join(" | ");
                appendMessage("agent", data.answer, meta);
            } catch (err) {
                appendMessage("agent error", "요청 실패: " + err.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "전송";
                input.focus();
            }
        });
    </script>
</body>
</html>
